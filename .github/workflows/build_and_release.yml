name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies (JDK + Kotlin)
      run: |
        sudo apt-get update
        sudo apt-get install -y default-jdk zip

        curl -s https://get.sdkman.io | bash
        source "$HOME/.sdkman/bin/sdkman-init.sh"
        sdk install kotlin

    - name: Create build folder
      run: mkdir -p build/assignment1 build/assignment2

    - name: Build assignment1 (C++)
      run: |
        g++ -std=c++17 -Iassignment1/eigen-3.4.0 assignment1/eigen1.cpp -o build/assignment1/matrix.out

    - name: Build assignment2 (C++ / Kotlin / C#)
      run: |
        for dir in "adaptor" "decorator" "factory method" "method_chain" "pasad"; do
          for file in assignment2/$dir/*; do
            case "$file" in
              *.cpp)
                g++ -std=c++17 "$file" -o build/assignment2/$(basename "$file" .cpp)_cpp.out
                ;;
              *.kt)
                kotlinc "$file" -include-runtime -d build/assignment2/$(basename "$file" .kt)_kt.jar
                ;;
              *.cs)
                dotnet new console -o temp_cs_project --force > /dev/null
                cp "$file" temp_cs_project/Program.cs
                pushd temp_cs_project
                dotnet build -c Release > /dev/null
                cp bin/Release/net*/temp_cs_project.dll ../build/assignment2/$(basename "$file" .cs)_cs.dll
                popd
                rm -rf temp_cs_project
                ;;
            esac
          done
        done

    - name: Zip all build outputs
      run: |
        cd build
        zip -r assignments.zip .

    - name: Zip full repository (excluding .git and build folder)
      run: |
        zip -r source.zip . -x "*.git*" "build/*"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: |
          build/assignments.zip
          source.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
